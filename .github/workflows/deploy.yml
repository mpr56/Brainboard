name: Deploy

# Runs only after CI has finished on main, and only if it passed, so a red
# main never reaches production. Re-run by hand from the Actions tab with
# "Run workflow" (it deploys the branch you pick, after a fresh build).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue rather than cancel, so one never stops halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  # Created once with: npx wrangler pages project create brainboard --production-branch main
  PAGES_PROJECT: brainboard

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Repo secrets can be scoped to this environment, and it can require approval.
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy the commit CI approved, not whatever main has moved on to.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Publish dist/
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-hash=${{ github.event.workflow_run.head_sha || github.sha }}
